# ── CI ───────────────────────────────────────────────────────────────────────
#
# The repository's own gate, running the same commands a developer runs locally:
# static type check, unit tests, the coverage run and the production build.
#
# Until this workflow existed the only automation was `.github/workflows/deploy.yml`,
# so a pull request could reach `main` (and therefore production) without any test
# or type check ever having run. The darkfactory quality lane measured the default
# branch as:
#
#   coverage rung `unmeasured` — `capability:coverage_tooling_absent`
#   quality tools configured: tsc — enforced in CI: none
#
# Both findings are closed here:
#
#   1. Coverage. `npm run coverage` (c8, `devDependencies`) runs the unit suite,
#      prints the line total, fails below the floor in `.c8rc.json` and writes
#      `coverage/lcov.info`. That report is committed: a CI log line expires,
#      while a committed report stays readable from `main` and gives the lane a
#      real percentage instead of "unavailable".
#   2. Static tooling. `tsconfig.json` (tsc) was configured but never executed by
#      CI; `npx tsc --noEmit` now gates the merge.
#
# The workflow is covered by `tests/coverage-workflow.test.mjs`, which asserts the
# steps below and that the floor declared here still equals `.c8rc.json`.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Exactly 22.23.1: it is the patch release the committed `coverage/lcov.info`
      # was generated with. A different V8 would shift the per-line counters and
      # fail the "report is current" gate below without anything having regressed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Coverage (line total + floor from .c8rc.json)
        # The floor lives in `.c8rc.json` (single source of truth for the local
        # `npm run coverage` too); this variable mirrors it so that changing the
        # ratchet is an explicit, reviewable edit in two places, and so a drift
        # fails here loudly instead of silently weakening the gate.
        env:
          COVERAGE_FAIL_UNDER: 90
        run: |
          set -euo pipefail
          floor="$(node -p "require('./.c8rc.json').lines")"
          if [ "$floor" != "$COVERAGE_FAIL_UNDER" ]; then
            echo "::error::coverage floor drift: .c8rc.json says ${floor}, workflow says ${COVERAGE_FAIL_UNDER}"
            exit 1
          fi
          npm run coverage

      - name: coverage/lcov.info must be committed and current
        run: git diff --exit-code -- coverage/lcov.info

      - name: Build (astro build)
        run: npm run build
