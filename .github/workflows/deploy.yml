# ── Deploy to Coolify ────────────────────────────────────────────────────────
#
# The only automatic path from `main` to production for this repo, so a green
# run must mean "Coolify built and finished the deployment".
#
# Kanban t_5d2882f3: this workflow used to POST to Coolify app
# `b8f8kmbenoly2e9ase1b3joj`, which had been deleted — Coolify answered
# HTTP 404 `{"message":"No resources found."}` — and piped `curl -s` into
# `python3 -c ... || echo "unknown"`, so that 404 body produced
# `deployment_uuid=unknown` and a green job while nothing was deployed. The last
# run that queued anything was 31888050214 (main @ 5d47a4a, conclusion success).
# The production app exists again as `rabar.nl`
# (`0g5foqmnwtajdv31rxnr9fej`) in Coolify project/environment
# `rabar.nl` / `production`.
#
# Kanban t_e124e983: that uuid was itself stale by the time it was written — the
# factory recreated the application at 05:54Z on 2026-09-26 and Coolify mints a
# new uuid for every recreation, so it answered HTTP 404 `No resources found.` for
# `0g5foqmnwtajdv31rxnr9fej` and the next push to `main` could not deploy. A uuid
# in this file is a copy of provider state that goes stale with no change on this
# side, so step 0 resolves the application by name (`rabar-nl-production`) and
# fails closed unless exactly one application carries it. `vars.COOLIFY_APP_UUID`
# still overrides the lookup, and the uuid that exists today is used only when the
# lookup itself cannot be answered (never as a silent substitute for a name that
# matched nothing).
#
# Every failure mode below is an explicit, annotated failure:
#
#   0. Resolve  — GET /api/v1/applications and match the application by name;
#                 zero matches, several matches and an unparsable answer all fail
#                 without deploying (kanban t_e124e983).
#   1. Trigger  — POST /api/v1/deploy and fail unless the response is 2xx AND
#                 carries a non-empty deployments[0].deployment_uuid.
#   2. Wait     — poll the deployment record; only `finished` is success, and
#                 `failed`/`error`/`cancelled`/timeout fail the job. Kanban
#                 t_2b136b43: the poll mirrors the trigger step's status handling,
#                 so an empty token secret, a non-2xx answer (including a
#                 transport error with no status code) or a 2xx body without a
#                 usable `status` fails *immediately* with the HTTP code and the
#                 body, instead of polling for the full 60 × 20s budget and then
#                 blaming the timeout. That is the difference between fail-fast
#                 and fail-slow: every path here was already red, just late.
#
# COOLIFY_API_TOKEN is a Coolify API token with Deploy permission (Coolify →
# Keys & Tokens → API tokens) stored as a repository secret. It is referenced
# only through env + ${{ secrets.* }} and never echoed (GitHub masks it anyway).
#
# Behaviour is covered by tests/deploy-workflow.test.mjs, which runs these exact
# `run:` blocks under bash with a stubbed curl:
#   npm test
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Worst case wait budget: 60 attempts × 20s sleep = 20 min (59 sleeps now that
    # the final attempt no longer sleeps) plus the public-route probe's 11 × 10s =
    # ~2 min, plus one curl per attempt. 35 min keeps the ≥10 min of curl overhead
    # the job has always reserved (kanban t_2b136b43, extended by t_b3c11ef4).
    timeout-minutes: 35
    steps:
      - name: Trigger Coolify deployment
        id: trigger
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          # Repo variables may override the fleet defaults (kanban t_2b136b43,
          # item 5). An unset variable expands to "" and the `:-` default in the
          # run block applies, so this repo keeps its own values until a variable
          # is deliberately set.
          COOLIFY_API_BASE: ${{ vars.COOLIFY_API_BASE }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          # The Coolify *application name* — the app in Coolify's project/environment
          # rabar.nl / production — not the public domain.
          COOLIFY_APP_NAME: ${{ vars.COOLIFY_APP_NAME }}
        run: |
          set -euo pipefail

          COOLIFY_API_BASE="${COOLIFY_API_BASE:-https://dev.7rb.nl/api/v1}"
          # kanban t_e124e983: this file used to pin production to a Coolify uuid, and
          # that is provider state — Coolify mints a new uuid every time an
          # application is recreated, which this factory does. rabar.nl was recreated
          # at 05:54Z on 2026-09-26, while main @ cfdaac52 kept pinning
          # `0g5foqmnwtajdv31rxnr9fej`, an application Coolify had already deleted, so
          # the next push to main answered HTTP 404 `No resources found.` and nothing
          # was deployed. The application is therefore resolved by name; the uuid
          # survives only as the operator override and as the fallback for a lookup
          # that cannot be answered at all.
          COOLIFY_APP_NAME="${COOLIFY_APP_NAME:-rabar-nl-production}"
          COOLIFY_APP_UUID="${COOLIFY_APP_UUID:-}"
          # The application that exists today, used only when the lookup itself is
          # unavailable (see the notice below) — never as a silent substitute for a
          # name that matched nothing or matched too much.
          COOLIFY_DEFAULT_APP_UUID="${COOLIFY_APP_UUID:-gpybljtcutrtp1tnxnsx0ix9}"

          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "::error title=Coolify API token missing::The COOLIFY_API_TOKEN repository secret is empty or unset, so no deployment can be triggered. Add or rotate it under Settings → Secrets and variables → Actions (Coolify → Keys & Tokens → API tokens)."
            exit 1
          fi

          if [ -z "${COOLIFY_APP_UUID}" ]; then
            LOOKUP_FILE="$(mktemp)"
            LOOKUP_CODE="$(curl -sS --fail-with-body -o "${LOOKUP_FILE}" -w '%{http_code}' \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_API_BASE}/applications" || true)"
            case "${LOOKUP_CODE}" in
              ''|*[!0-9]*) LOOKUP_CODE="000" ;;
            esac
            LOOKUP_BODY="$(cat "${LOOKUP_FILE}" 2>/dev/null || true)"
            rm -f "${LOOKUP_FILE}"
            # One bounded line, for the same reason as RESPONSE_ONE_LINE below: the
            # body is third-party text (kanban t_0838bbdf).
            LOOKUP_ONE_LINE="$(printf '%s' "${LOOKUP_BODY}" | tr -d '\r' | tr '\n\t' '  ' | cut -c1-500)"

            if [ "${LOOKUP_CODE}" -lt 200 ] || [ "${LOOKUP_CODE}" -ge 300 ]; then
              # A rejected lookup — a token without read permission, a 5xx, a
              # transport error — is not evidence that the pinned uuid is wrong, so
              # deploy to the pin and say so. If the pin is gone too, the deploy call
              # below answers 404 and fails with the deleted-application annotation
              # instead of going green.
              COOLIFY_APP_UUID="${COOLIFY_DEFAULT_APP_UUID}"
              echo "::notice title=Coolify app lookup unavailable::GET ${COOLIFY_API_BASE}/applications answered HTTP ${LOOKUP_CODE}: ${LOOKUP_ONE_LINE} — deploying to the pinned application uuid ${COOLIFY_APP_UUID} instead. Set the COOLIFY_APP_UUID repository variable to make this deliberate."
            else
              # Exactly one application must carry the name. A name that matches
              # none, that matches several (the live fleet already lists two
              # applications called `rubenbarels-nl-development`), or an answer that
              # cannot be parsed leaves the step unable to decide, and an undecided
              # step must deploy nothing rather than deploy to whatever exists.
              MATCHES="$(printf '%s' "${LOOKUP_BODY}" | python3 -c '
          import json, sys
          try:
              payload = json.load(sys.stdin)
          except ValueError:
              sys.exit(1)
          name = sys.argv[1]
          if not isinstance(payload, list):
              sys.exit(1)
          uuids = [str(row.get("uuid") or "") for row in payload
                   if isinstance(row, dict) and str(row.get("name") or "") == name]
          sys.stdout.write("%d|%s|%s" % (len(uuids), uuids[0] if len(uuids) == 1 else "", ",".join(uuids[:5])))
          ' "${COOLIFY_APP_NAME}" 2>/dev/null || true)"

              MATCH_COUNT="${MATCHES%%|*}"
              MATCH_REMAINDER="${MATCHES#*|}"
              MATCH_UUID="${MATCH_REMAINDER%%|*}"
              MATCH_LIST="${MATCH_REMAINDER#*|}"

              if [ "${MATCH_COUNT}" != "1" ] || [ -z "${MATCH_UUID}" ]; then
                echo "::error title=Coolify app uuid cannot be resolved::GET ${COOLIFY_API_BASE}/applications listed ${MATCH_COUNT:-0} application(s) named '${COOLIFY_APP_NAME}' (uuids: ${MATCH_LIST:-none}), and exactly one is required — nothing was deployed. Set the COOLIFY_APP_UUID repository variable to the application this repository must deploy (kanban t_e124e983)."
                exit 1
              fi

              # The uuid came from the provider, so it is validated before it is
              # interpolated anywhere — the same rule the deployment uuid below is
              # held to (kanban t_2b136b43, item 3).
              case "${MATCH_UUID}" in
                *[!A-Za-z0-9._-]*)
                  echo "::error title=Coolify returned an unexpected application uuid::The uuid of '${COOLIFY_APP_NAME}' is not a plain [A-Za-z0-9._-] identifier, so it is not used: ${LOOKUP_ONE_LINE}"
                  exit 1
                  ;;
              esac

              COOLIFY_APP_UUID="${MATCH_UUID}"
              echo "::notice title=Coolify app resolved::${COOLIFY_APP_NAME} → ${COOLIFY_APP_UUID}"
            fi
          fi

          echo "Triggering Coolify deployment for rabar.nl..."
          BODY_FILE="$(mktemp)"
          # --fail-with-body makes curl exit non-zero on HTTP >= 400 while still
          # writing the error body to BODY_FILE, so a 404 (deleted app uuid) or a
          # 401 (stale token) is reported instead of silently parsed. `|| true`
          # keeps the HTTP code available for the checks below instead of
          # aborting before we can annotate the error.
          HTTP_CODE="$(curl -sS --fail-with-body -o "${BODY_FILE}" -w '%{http_code}' \
            -X POST "${COOLIFY_API_BASE}/deploy" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"${COOLIFY_APP_UUID}\", \"force\": false}" || true)"
          RESPONSE="$(cat "${BODY_FILE}")"
          rm -f "${BODY_FILE}"

          # A transport error makes curl print no status code at all; `000` keeps
          # that an explicit non-2xx instead of leaving `[ -lt ]` to fail with
          # "integer expression expected" (kanban t_2b136b43, item 2).
          case "${HTTP_CODE}" in
            ''|*[!0-9]*) HTTP_CODE="000" ;;
          esac

          # One bounded line, used by every log line and `::error` annotation that
          # quotes third-party text: GitHub annotations are line-oriented and the
          # runner parses a step's stdout for workflow commands, so a body with a
          # line break could otherwise forge an annotation or a log line (kanban
          # t_0838bbdf).
          RESPONSE_ONE_LINE="$(printf '%s' "${RESPONSE}" | tr -d '\r' | tr '\n\t' '  ' | cut -c1-500)"

          echo "HTTP ${HTTP_CODE}"
          echo "Response: ${RESPONSE_ONE_LINE}"

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error title=Coolify rejected the deployment::HTTP ${HTTP_CODE} from ${COOLIFY_API_BASE}/deploy: ${RESPONSE_ONE_LINE} (HTTP 404 'No resources found.' means the Coolify app uuid ${COOLIFY_APP_UUID} no longer exists — check the app in Coolify; HTTP 401 'Unauthenticated.' means the COOLIFY_API_TOKEN secret is stale or revoked — rotate it and re-run this workflow; kanban t_5d2882f3)."
            exit 1
          fi

          # A 2xx is not proof of a queued deployment: Coolify answers
          # {"message":"..."} for errors and {"deployments":[]} when nothing was
          # queued. Only a non-empty deployment uuid counts as success.
          DEPLOY_UUID="$(printf '%s' "${RESPONSE}" | python3 -c '
          import json, sys
          try:
              payload = json.load(sys.stdin)
          except ValueError:
              sys.exit(1)
          if not isinstance(payload, dict):
              sys.exit(1)
          deployments = payload.get("deployments") or []
          if not isinstance(deployments, list) or not deployments:
              sys.exit(1)
          first = deployments[0] or {}
          uuid = first.get("deployment_uuid") or ""
          if not uuid:
              sys.exit(1)
          sys.stdout.write(uuid)
          ' 2>/dev/null || true)"

          if [ -z "${DEPLOY_UUID}" ]; then
            echo "::error title=Coolify deployment not queued::Coolify answered HTTP ${HTTP_CODE} without a deployment uuid, so nothing was deployed: ${RESPONSE_ONE_LINE}"
            exit 1
          fi

          # The uuid is published as a step output, so refuse to publish anything
          # that is not the plain identifier Coolify returns — an unexpected
          # payload cannot inject a line into $GITHUB_OUTPUT (kanban t_2b136b43,
          # item 3).
          case "${DEPLOY_UUID}" in
            *[!A-Za-z0-9._-]*)
              echo "::error title=Coolify returned an unexpected deployment uuid::The deployment uuid is not a plain [A-Za-z0-9._-] identifier, so it is not published as a step output: ${RESPONSE_ONE_LINE}"
              exit 1
              ;;
          esac

          echo "deployment_uuid=${DEPLOY_UUID}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Coolify deployment queued::${DEPLOY_UUID}"

      # A queued deployment can still fail to build, so the job must not go green
      # the moment Coolify accepted the request. Only Coolify reporting the build
      # as `finished` counts as a successful deploy.
      - name: Wait for Coolify deployment to finish
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_BASE: ${{ vars.COOLIFY_API_BASE }}
          COOLIFY_APP_NAME: rabar.nl
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
          DEPLOYMENT_ATTEMPTS: "60"
          DEPLOYMENT_WAIT_SECONDS: "20"
        run: |
          set -euo pipefail

          COOLIFY_API_BASE="${COOLIFY_API_BASE:-https://dev.7rb.nl/api/v1}"
          COOLIFY_APP_NAME="${COOLIFY_APP_NAME:-rabar.nl}"
          ATTEMPTS="${DEPLOYMENT_ATTEMPTS:-60}"
          WAIT_SECONDS="${DEPLOYMENT_WAIT_SECONDS:-20}"
          DEPLOYMENT_UUID="${DEPLOYMENT_UUID:-}"

          if [ -z "${DEPLOYMENT_UUID}" ]; then
            echo "::error title=No deployment to wait for::The trigger step reported no deployment uuid, so there is nothing to verify."
            exit 1
          fi

          # Same guard as the trigger step: without a token every poll would come
          # back 401 and, before this change, would burn the 60 × 20s budget.
          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "::error title=Coolify API token missing::The COOLIFY_API_TOKEN repository secret is empty or unset, so the deployment cannot be polled. Add or rotate it under Settings → Secrets and variables → Actions (Coolify → Keys & Tokens → API tokens)."
            exit 1
          fi

          STATUS=""
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            POLL_FILE="$(mktemp)"
            # The trigger step's status handling, applied to the poll:
            # --fail-with-body keeps the error body, -w '%{http_code}' keeps the
            # code, and `|| true` leaves both for the checks below instead of
            # aborting the step inside the loop.
            HTTP_CODE="$(curl -sS --fail-with-body -o "${POLL_FILE}" -w '%{http_code}' \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_API_BASE}/deployments/${DEPLOYMENT_UUID}" || true)"
            case "${HTTP_CODE}" in
              ''|*[!0-9]*) HTTP_CODE="000" ;;
            esac
            BODY="$(cat "${POLL_FILE}" 2>/dev/null || true)"
            rm -f "${POLL_FILE}"

            # One bounded line, so a multi-line third-party body cannot forge a
            # workflow command in an annotation or bloat the log.
            BODY_ONE_LINE="$(printf '%s' "${BODY}" | tr -d '\r' | tr '\n\t' '  ' | cut -c1-500)"

            STATUS="$(printf '%s' "${BODY}" | python3 -c '
          import json, sys
          try:
              payload = json.load(sys.stdin)
          except ValueError:
              sys.exit(1)
          if not isinstance(payload, dict):
              sys.exit(1)
          status = payload.get("status") or ""
          if not isinstance(status, str):
              sys.exit(1)
          sys.stdout.write(status)
          ' 2>/dev/null || true)"

            # `status` is third-party text too: JSON allows an escaped "\n" inside a
            # string, and it arrives here as a real line break, so the value used in
            # the log line below could forge a workflow command (kanban t_0838bbdf).
            STATUS_ONE_LINE="$(printf '%s' "${STATUS}" | tr -d '\r' | tr '\n\t' '  ' | cut -c1-200)"

            echo "[${attempt}/${ATTEMPTS}] deployment ${DEPLOYMENT_UUID}: HTTP ${HTTP_CODE} status ${STATUS_ONE_LINE:-<no status reported>}"

            # A rejected poll never turns into a success by waiting, so report the
            # HTTP code and the body now instead of burning the remaining budget
            # and failing with a timeout that hides the real reason (a 401 here
            # means the token died mid-run; a 404 means the record is gone).
            if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
              echo "::error title=Coolify API rejected the poll::GET ${COOLIFY_API_BASE}/deployments/${DEPLOYMENT_UUID} answered HTTP ${HTTP_CODE} on attempt ${attempt}/${ATTEMPTS}: ${BODY_ONE_LINE} — HTTP 401 'Unauthenticated.' means the COOLIFY_API_TOKEN secret is stale or revoked (rotate it and re-run this workflow); HTTP 404 means the deployment or its application was removed mid-build. kanban t_2b136b43."
              exit 1
            fi

            # A 2xx body without a usable status is not a deployment state either:
            # only `finished` may end this loop green, so an unusable answer is
            # reported with its body rather than retried for 20 minutes.
            if [ -z "${STATUS}" ]; then
              echo "::error title=Coolify poll answer carries no deployment status::GET ${COOLIFY_API_BASE}/deployments/${DEPLOYMENT_UUID} answered HTTP ${HTTP_CODE} with a body that has no usable status field: ${BODY_ONE_LINE}"
              exit 1
            fi

            case "${STATUS}" in
              finished)
                echo "::notice title=Coolify deployment finished::${DEPLOYMENT_UUID} built and deployed."
                exit 0
                ;;
              failed|error|cancelled|cancelled-by-user)
                echo "::error title=Coolify deployment ${STATUS}::${DEPLOYMENT_UUID} ended as ${STATUS}. Check the Coolify deployment log (https://dev.7rb.nl → ${COOLIFY_APP_NAME} → deployments) before re-running."
                exit 1
                ;;
            esac

            # No sleep after the final attempt: the job has nothing left to wait for.
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              sleep "${WAIT_SECONDS}"
            fi
          done

          echo "::error title=Coolify deployment not verified::${DEPLOYMENT_UUID} did not reach 'finished' within $((ATTEMPTS * WAIT_SECONDS))s (last status: ${STATUS_ONE_LINE:-<none>}). It may still be queued behind another build — re-run this workflow once the Coolify queue is clear."
          exit 1

      # Kanban t_b3c11ef4: a deployment Coolify reports as `finished` is not release
      # evidence. Coolify bakes the routed labels into the container when it builds
      # it, so an application whose public domain was declared `http://rabar.nl`
      # while `is_force_https_enabled` redirects http to https served
      # `http://rabar.nl` a 200 to nobody's browser and `https://rabar.nl` — the
      # route every browser uses — the proxy's `503 no available server`
      # (deployment wh6cict1nipkgv4oe9unqpbq finished 2026-10-01T17:24Z; the route
      # was still 503 on 2026-10-03T09:35Z and only came back when the application
      # was redeployed with the corrected domain at 09:37Z). This workflow stayed
      # green throughout, and the first component to notice was the factory's own
      # public-endpoint watcher. A green run must therefore also mean "a browser can
      # load the site", so the job probes the public route and only a 2xx/3xx ends it.
      #
      # The probe deliberately forces `https` and follows redirects: probing the
      # declared scheme is exactly what would have missed the incident, and a browser
      # follows the redirect chain to whatever the visitor actually lands on.
      - name: Verify the deployed site answers on its public route
        id: route
        env:
          # An unset repo variable expands to "" and the `:-` default applies — the
          # same contract the trigger step uses. The default is the URL this
          # repository already declares for the built site (`astro.config.mjs`
          # `site:`); tests/deploy-workflow.test.mjs pins the two together so the
          # probe can never verify a route nobody visits.
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          ROUTE_ATTEMPTS: "12"
          ROUTE_WAIT_SECONDS: "10"
        run: |
          set -euo pipefail

          PRODUCTION_URL="${PRODUCTION_URL:-https://rabar.nl}"
          ATTEMPTS="${ROUTE_ATTEMPTS:-12}"
          WAIT_SECONDS="${ROUTE_WAIT_SECONDS:-10}"

          # Only a scheme+host is a route. A bare host, a path, or a host carrying
          # shell metacharacters must fail before a request is made, so a copy-paste
          # error in a repository variable produces an annotation instead of a probe
          # of whatever it happened to spell.
          case "${PRODUCTION_URL}" in
            http://*|https://*) ;;
            *)
              echo "::error title=Production URL is not a route::PRODUCTION_URL='${PRODUCTION_URL}' is not an http(s) URL, so the deployed site's public route could not be verified. Set the PRODUCTION_URL repository variable to the public https URL of this application (kanban t_b3c11ef4)."
              exit 1
              ;;
          esac
          ROUTE_HOST="$(printf '%s' "${PRODUCTION_URL}" | sed -E 's#^https?://##; s#/.*$##')"
          case "${ROUTE_HOST}" in
            ''|*[!A-Za-z0-9.-]*)
              echo "::error title=Production URL has no plain host::PRODUCTION_URL='${PRODUCTION_URL}' does not carry a plain [A-Za-z0-9.-] host, so the deployed site's public route could not be verified (kanban t_b3c11ef4)."
              exit 1
              ;;
          esac
          PROBE_URL="https://${ROUTE_HOST}/"

          ROUTE_CODE=""
          ROUTE_BODY_ONE_LINE=""
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            PROBE_FILE="$(mktemp)"
            # No `--fail`: a 503 is the answer being verified, not a transport
            # failure, and its body is what an operator needs to read. The body is
            # third-party text, so it is reduced to one bounded line before it can
            # reach a log line or an annotation (kanban t_0838bbdf).
            ROUTE_CODE="$(curl -sS -o "${PROBE_FILE}" -w '%{http_code}' \
              --location --max-redirs 5 --max-time 15 "${PROBE_URL}" || true)"
            ROUTE_BODY="$(cat "${PROBE_FILE}" 2>/dev/null || true)"
            rm -f "${PROBE_FILE}"
            # A transport error prints no status code at all; `000` keeps that an
            # explicit non-2xx instead of an arithmetic error (kanban t_2b136b43).
            case "${ROUTE_CODE}" in
              ''|*[!0-9]*) ROUTE_CODE="000" ;;
            esac
            ROUTE_BODY_ONE_LINE="$(printf '%s' "${ROUTE_BODY}" | tr -d '\r' | tr '\n\t' '  ' | cut -c1-200)"

            echo "[${attempt}/${ATTEMPTS}] ${PROBE_URL} answered HTTP ${ROUTE_CODE} ${ROUTE_BODY_ONE_LINE}"

            if [ "${ROUTE_CODE}" -ge 200 ] && [ "${ROUTE_CODE}" -lt 400 ]; then
              echo "::notice title=Production route verified::${PROBE_URL} answered HTTP ${ROUTE_CODE}."
              exit 0
            fi

            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              sleep "${WAIT_SECONDS}"
            fi
          done

          # Both causes look identical from here, so the remedy names both: a public
          # domain Coolify has never routed (its scheme must be https) and a domain
          # corrected *after* the last build, where the corrected labels only take
          # effect on a redeploy — which re-running this workflow performs.
          echo "::error title=Production route is not serving::${PROBE_URL} answered HTTP ${ROUTE_CODE} on all ${ATTEMPTS} attempts (last body: ${ROUTE_BODY_ONE_LINE:-<empty>}) even though Coolify reported the deployment finished, so the site is unreachable for a browser. Check that ${ROUTE_HOST} is the application's public domain in Coolify with the https scheme, then re-run this workflow so the container is rebuilt with the corrected routing labels. kanban t_b3c11ef4."
          exit 1
